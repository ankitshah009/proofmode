<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">ProofMode architecture</title>
  <desc id="desc">The browser sends a screenshot and official facts to the ProofMode server, which checks the input, applies a rate limit and sends one request through OpenRouter to Muse Ember. The reply comes back through a local citation check and a verdict computed in code before it is shown in the browser. The screenshot and the model reply are untrusted.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d8d2c4"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5482d"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#12110f"/>

  <!-- Title and key -->
  <text x="40" y="46" fill="#f1ede4" font-size="21" font-weight="600">How one check moves through ProofMode</text>
  <rect x="938" y="33" width="26" height="16" rx="3" fill="none" stroke="#e5482d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="974" y="46" fill="#a39e92" font-size="13">Untrusted, handled as data</text>

  <!-- Trust boundaries -->
  <g stroke="#4a473f" stroke-width="1" stroke-dasharray="3 5">
    <line x1="310" y1="68" x2="310" y2="408"/>
    <line x1="790" y1="68" x2="790" y2="408"/>
    <line x1="995" y1="68" x2="995" y2="408"/>
  </g>
  <g fill="#a39e92" font-size="11" font-weight="600" letter-spacing="1.2">
    <text x="40" y="84">PERSON'S DEVICE</text>
    <text x="340" y="84">SERVER YOU RUN</text>
    <text x="820" y="84">THIRD PARTY</text>
    <text x="1020" y="84">MODEL PROVIDER</text>
  </g>

  <!-- Panels -->
  <g fill="#1b1a17" stroke="#34322c" stroke-width="1">
    <rect x="40" y="96" width="240" height="296" rx="10"/>
    <rect x="340" y="96" width="420" height="296" rx="10"/>
    <rect x="820" y="96" width="150" height="296" rx="10"/>
    <rect x="1020" y="96" width="140" height="296" rx="10"/>
  </g>
  <g fill="#f1ede4" font-size="16" font-weight="600">
    <text x="56" y="128">Browser</text>
    <text x="356" y="128">ProofMode server</text>
    <text x="832" y="128">OpenRouter</text>
    <text x="1032" y="128">Muse Ember</text>
  </g>

  <!-- Browser: inputs -->
  <rect x="56" y="144" width="208" height="34" rx="6" fill="#24221e" stroke="#e5482d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="68" y="166" fill="#f1ede4" font-size="13" font-weight="600">Screenshot</text>
  <text x="252" y="165" fill="#e5482d" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">UNTRUSTED</text>
  <rect x="56" y="184" width="208" height="34" rx="6" fill="#24221e" stroke="#34322c"/>
  <text x="68" y="206" fill="#f1ede4" font-size="13" font-weight="600">Official facts</text>
  <text x="252" y="205" fill="#a39e92" font-size="11" text-anchor="end">one per line</text>

  <!-- Browser: result -->
  <rect x="56" y="304" width="208" height="64" rx="6" fill="#24221e" stroke="#34322c"/>
  <text x="160" y="331" fill="#f1ede4" font-size="13" font-weight="600" text-anchor="middle">Verdict and claims</text>
  <text x="160" y="350" fill="#a39e92" font-size="11.5" text-anchor="middle">each with the fact it quotes</text>

  <!-- Server: request row -->
  <g fill="#24221e" stroke="#34322c">
    <rect x="356" y="148" width="124" height="64" rx="6"/>
    <rect x="488" y="148" width="124" height="64" rx="6"/>
    <rect x="620" y="148" width="124" height="64" rx="6"/>
  </g>
  <g fill="#f1ede4" font-size="13" font-weight="600" text-anchor="middle">
    <text x="418" y="175">Input checks</text>
    <text x="550" y="175">Rate limit</text>
    <text x="682" y="175">One request</text>
  </g>
  <g fill="#a39e92" font-size="11.5" text-anchor="middle">
    <text x="418" y="194">type, size, facts</text>
    <text x="550" y="194">per client</text>
    <text x="682" y="194">strict JSON schema</text>
  </g>

  <!-- Server: middle row -->
  <g fill="none" stroke="#34322c">
    <rect x="356" y="230" width="190" height="56" rx="6"/>
    <rect x="554" y="230" width="190" height="56" rx="6"/>
  </g>
  <g fill="#f1ede4" font-size="13" font-weight="600" text-anchor="middle">
    <text x="451" y="254">Security headers</text>
    <text x="649" y="254">Screenshot text is data</text>
  </g>
  <g fill="#a39e92" font-size="11.5" text-anchor="middle">
    <text x="451" y="272">on every response</text>
    <text x="649" y="272">instructions in it are ignored</text>
  </g>

  <!-- Server: response row -->
  <g fill="#24221e" stroke="#34322c">
    <rect x="356" y="304" width="190" height="64" rx="6"/>
    <rect x="554" y="304" width="190" height="64" rx="6"/>
  </g>
  <g fill="#f1ede4" font-size="13" font-weight="600" text-anchor="middle">
    <text x="451" y="331">Verdict computed in code</text>
    <text x="649" y="331">Local citation check</text>
  </g>
  <g fill="#a39e92" font-size="11.5" text-anchor="middle">
    <text x="451" y="350">from the checked claims</text>
    <text x="649" y="350">id exists, quote is in the fact</text>
  </g>
  <line x1="554" y1="336" x2="546" y2="336" stroke="#d8d2c4" stroke-width="1.5"/>

  <!-- OpenRouter -->
  <g fill="#24221e" stroke="#34322c">
    <rect x="832" y="148" width="126" height="64" rx="6"/>
    <rect x="832" y="304" width="126" height="64" rx="6"/>
  </g>
  <g fill="#f1ede4" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="895" y="175">Chat Completions</text>
    <text x="895" y="331">Returns the reply</text>
  </g>
  <g fill="#a39e92" font-size="11.5" text-anchor="middle">
    <text x="895" y="194">routes the call</text>
    <text x="895" y="350">as JSON text</text>
  </g>

  <!-- Muse Ember -->
  <rect x="1032" y="148" width="116" height="64" rx="6" fill="#24221e" stroke="#34322c"/>
  <text x="1090" y="175" fill="#f1ede4" font-size="12.5" font-weight="600" text-anchor="middle">Reads the image</text>
  <text x="1090" y="194" fill="#a39e92" font-size="11.5" text-anchor="middle">judges each claim</text>
  <rect x="1032" y="304" width="116" height="64" rx="6" fill="#24221e" stroke="#e5482d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1090" y="331" fill="#f1ede4" font-size="12.5" font-weight="600" text-anchor="middle">Model reply</text>
  <text x="1090" y="350" fill="#e5482d" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">UNTRUSTED</text>

  <!-- Request arrows -->
  <g stroke="#d8d2c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="282" y1="180" x2="338" y2="180"/>
    <line x1="762" y1="180" x2="818" y2="180"/>
    <line x1="972" y1="180" x2="1018" y2="180"/>
  </g>
  <!-- Response arrows -->
  <g stroke="#e5482d" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-accent)">
    <line x1="1018" y1="336" x2="972" y2="336"/>
    <line x1="818" y1="336" x2="762" y2="336"/>
  </g>
  <line x1="338" y1="336" x2="282" y2="336" stroke="#d8d2c4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step numbers -->
  <g fill="#e5482d">
    <circle cx="310" cy="156" r="11"/>
    <circle cx="790" cy="156" r="11"/>
    <circle cx="995" cy="156" r="11"/>
    <circle cx="995" cy="312" r="11"/>
    <circle cx="790" cy="312" r="11"/>
    <circle cx="310" cy="312" r="11"/>
  </g>
  <g fill="#12110f" font-size="12" font-weight="700" text-anchor="middle">
    <text x="310" y="160.5">1</text>
    <text x="790" y="160.5">2</text>
    <text x="995" y="160.5">3</text>
    <text x="995" y="316.5">4</text>
    <text x="790" y="316.5">5</text>
    <text x="310" y="316.5">6</text>
  </g>

  <!-- Step key -->
  <line x1="40" y1="432" x2="1160" y2="432" stroke="#34322c"/>
  <g fill="#e5482d">
    <circle cx="51" cy="466" r="11"/>
    <circle cx="51" cy="508" r="11"/>
    <circle cx="431" cy="466" r="11"/>
    <circle cx="431" cy="508" r="11"/>
    <circle cx="811" cy="466" r="11"/>
    <circle cx="811" cy="508" r="11"/>
  </g>
  <g fill="#12110f" font-size="12" font-weight="700" text-anchor="middle">
    <text x="51" y="470.5">1</text>
    <text x="51" y="512.5">2</text>
    <text x="431" y="470.5">3</text>
    <text x="431" y="512.5">4</text>
    <text x="811" y="470.5">5</text>
    <text x="811" y="512.5">6</text>
  </g>
  <g fill="#d8d2c4" font-size="13">
    <text x="72" y="470.5">Screenshot and official facts are uploaded</text>
    <text x="72" y="512.5">One request: numbered facts, screenshot, schema</text>
    <text x="452" y="470.5">OpenRouter routes the request to Muse Ember</text>
    <text x="452" y="512.5">Muse Ember returns claims with cited quotes</text>
    <text x="832" y="470.5">The reply reaches the server, still untrusted</text>
    <text x="832" y="512.5">Checked claims and the verdict are displayed</text>
  </g>
</svg>
